name: Build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Set release version
        id: version
        shell: bash
        run: |
          version="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)-$(git rev-parse --short=7 HEAD)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Package Figma plugin
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: zip -q "Vasometric-${VERSION}.zip" manifest.json dist/code.js dist/ui.html
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vasometric-zip
          path: Vasometric-*.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vasometric-zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: gh release create "$VERSION" "Vasometric-${VERSION}.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
