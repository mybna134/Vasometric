<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vasometric</title>
    <style>
      :root { color-scheme: light; font-family: Roboto, "Segoe UI", Arial, sans-serif; font-size: 12px; color: #1d1b20; background: #f7f5fa; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f5fa; }
      button, input { font: inherit; }
      button { color: inherit; transform-origin: center; transition: background-color .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease, transform .12s ease; }
      button:active { transform: scale(.95); }
      button.clicked { animation: button-click .24s ease-out; }
      @keyframes button-click { 0% { transform: scale(.95); } 65% { transform: scale(1.035); } 100% { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } button.clicked { animation: none; } }
      #app { height: 100vh; display: flex; flex-direction: column; }
      .topbar { min-height: 62px; padding: 0 20px; display: flex; flex-shrink: 0; align-items: center; justify-content: space-between; background: #f7f5fa; }
      .identity { display: flex; align-items: center; gap: 12px; }
      .mark { width: 40px; height: 40px; display: grid; place-items: center; }
      .mark svg { width: 36px; height: 36px; }
      .brand { color: #1d1b20; font-size: 15px; font-weight: 650; letter-spacing: .01em; }
      .subtitle { margin-top: 3px; color: #625d69; font-size: 10px; letter-spacing: .03em; }
      .language-control { position: relative; display: inline-flex; align-items: center; min-width: 118px; height: 36px; padding: 0 34px 0 12px; border: 1px solid #79747e; border-radius: 8px; color: #49454f; background: #f7f5fa; }
      .language-control:hover { background: #f0edf4; }
      .language-control:focus-within { border: 2px solid #6750a4; padding-left: 11px; }
      .language-control select { width: 100%; height: 100%; appearance: none; border: 0; outline: 0; color: inherit; background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; }
      .language-control svg { position: absolute; right: 9px; width: 18px; height: 18px; fill: currentColor; pointer-events: none; }
      main { padding: 10px 18px 16px; display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 14px; overflow-y: auto; }
      .modebar { display: grid; grid-template-columns: repeat(2, 1fr); padding: 4px; border: 1px solid #79747e; border-radius: 22px; background: #f7f5fa; }
      .mode { height: 34px; border: 0; border-radius: 18px; color: #49454f; background: transparent; cursor: pointer; font-size: 11px; font-weight: 600; }
      .mode.active { color: #fff; background: #6750a4; }
      .stage { position: relative; height: 220px; min-height: 220px; overflow: hidden; border-radius: 18px; background: #eeebf2; }
      .stage.grid-visible { background: #f5f4f7; }
      .stage-head { position: absolute; z-index: 1; top: 13px; left: 15px; color: #625d69; font-size: 10px; font-weight: 600; letter-spacing: .04em; }
      #preview { position: absolute; inset: 30px 15px 9px; width: calc(100% - 30px); height: calc(100% - 39px); }
      .empty-preview { position: absolute; inset: 48% 14px auto; color: #625d69; text-align: center; font-size: 11px; pointer-events: none; }
      .selectionline { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #625d69; font-size: 11px; }
      .selectionbadge { padding: 6px 11px; border-radius: 8px; color: #49454f; background: #e9e5ed; font-weight: 600; white-space: nowrap; }
      .selectionbadge.ready { color: #21005d; background: #e8def8; }
      .mode-panel { display: flex; flex-direction: column; gap: 12px; }
      .directions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
      .direction { min-height: 37px; border: 1px solid #79747e; border-radius: 9px; color: #49454f; background: transparent; cursor: pointer; font-size: 10px; font-weight: 600; }
      .direction.active { border-color: #6750a4; color: #21005d; background: #e8def8; }
      .subtabs { display: flex; gap: 2px; border-bottom: 1px solid #c9c5cd; }
      .subtab { position: relative; min-height: 34px; padding: 0 10px; border: 0; color: #625d69; background: transparent; cursor: pointer; }
      .subtab.active { color: #6750a4; font-weight: 650; }
      .subtab.active::after { position: absolute; right: 8px; bottom: -1px; left: 8px; height: 2px; content: ""; background: #6750a4; }
      .control-card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px 9px; border-radius: 14px; background: #f0edf4; }
      .control { display: grid; grid-template-columns: 84px 1fr 48px; align-items: center; gap: 9px; min-height: 34px; }
      .angle-control { grid-template-columns: 84px 1fr 64px; }
      .label { color: #49454f; }
      .control output { color: #1d1b20; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
      .extrusion-options { display: flex; flex-direction: column; gap: 9px; margin-top: 4px; padding-top: 11px; border-top: 1px solid #c9c5cd; }
      .extrusion-toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .option-toggle { display: flex; align-items: center; gap: 8px; min-height: 30px; color: #49454f; cursor: pointer; }
      .option-toggle input { width: 16px; height: 16px; margin: 0; accent-color: #6750a4; cursor: pointer; }
      .color-control { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; color: #49454f; }
      .color-trigger { display: inline-flex; align-items: center; gap: 7px; min-width: 132px; height: 32px; padding: 3px 7px; border: 1px solid #79747e; border-radius: 8px; background: #fff; cursor: pointer; }
      .color-trigger:hover { border-color: #6750a4; background: #f0edf4; }
      .color-trigger[aria-expanded="true"] { border: 2px solid #6750a4; }
      .color-value { font-size: 10px; font-variant-numeric: tabular-nums; }
      .color-swatch { position: relative; display: inline-block; flex: none; width: 25px; height: 24px; overflow: hidden; border: 1px solid #79747e; border-radius: 5px; background: conic-gradient(#d8d5dc 25%, #fff 0 50%, #d8d5dc 0 75%, #fff 0) 0 0 / 8px 8px; }
      .color-swatch-fill { position: absolute; inset: 0; }
      .color-popover { position: fixed; z-index: 10; width: 326px; padding: 12px; border: 1px solid #cac4d0; border-radius: 16px; background: #f7f5fa; box-shadow: 0 6px 20px #0003; }
      .picker-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 12px; }
      .picker-close { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 18px; }
      .picker-close:hover { background: #e9e5ed; }
      .picker-sv { position: relative; height: 188px; border-radius: 6px; background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent); cursor: crosshair; touch-action: none; }
      .picker-sv:focus-visible { outline: 2px solid #6750a4; outline-offset: 2px; }
      .picker-sv-thumb { position: absolute; width: 11px; height: 11px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #0009; transform: translate(-50%, -50%); pointer-events: none; }
      .picker-strips { display: grid; grid-template-columns: 1fr 30px; align-items: stretch; gap: 8px; margin-top: 8px; }
      .picker-bars { display: flex; flex-direction: column; justify-content: space-around; gap: 7px; }
      .picker-bars input[type=range] { display: block; width: 100%; height: 10px; margin: 0; border-radius: 2px; cursor: ew-resize; }
      #picker-hue { background: linear-gradient(to right, red, #ff0, #0f0, #0ff, #00f, #f0f, red); }
      .picker-alpha-track { position: relative; height: 10px; border-radius: 2px; background: conic-gradient(#d8d5dc 25%, #fff 0 50%, #d8d5dc 0 75%, #fff 0) 0 0 / 8px 8px; }
      #picker-alpha-gradient { position: absolute; inset: 0; border-radius: 2px; pointer-events: none; }
      .picker-alpha-track input[type=range] { position: relative; background: transparent; }
      .picker-bars input[type=range]::-webkit-slider-thumb { width: 7px; height: 16px; border: 2px solid #fff; border-radius: 2px; background: transparent; box-shadow: 0 0 0 1px #0007; }
      .picker-strips .color-swatch { width: 30px; height: 29px; }
      .picker-channels { display: grid; grid-template-columns: minmax(0, 1.8fr) repeat(4, minmax(0, 1fr)); gap: 5px; margin-top: 12px; }
      .picker-channels label { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #625d69; font-size: 10px; }
      .picker-channels input { width: 100%; height: 30px; padding: 0 3px; border: 1px solid #79747e; border-radius: 6px; color: #1d1b20; background: #fff; text-align: center; font-size: 10px; font-variant-numeric: tabular-nums; }
      .picker-channels input::-webkit-inner-spin-button, .picker-channels input::-webkit-outer-spin-button { appearance: none; margin: 0; }
      .picker-rgba-field { display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 7px; margin-top: 8px; color: #625d69; font-size: 10px; }
      .picker-rgba-field input { width: 100%; height: 29px; padding: 0 7px; border: 1px solid #79747e; border-radius: 6px; color: #1d1b20; background: #fff; font-size: 11px; font-variant-numeric: tabular-nums; }
      .color-popover input:focus { border-color: #6750a4; outline: 1px solid #6750a4; }
      .color-popover input[aria-invalid="true"] { border-color: #b3261e; outline-color: #b3261e; }
      .picker-material { margin-top: 12px; padding-top: 10px; border-top: 1px solid #c9c5cd; }
      .picker-material-title { display: block; margin-bottom: 8px; color: #625d69; font-size: 10px; }
      .picker-material-colors { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 4px; }
      .picker-material-colors button { flex: none; width: 22px; height: 22px; padding: 0; border: 1px solid #0002; border-radius: 6px; cursor: pointer; }
      .picker-material-colors button[aria-pressed="true"] { outline: 2px solid #6750a4; outline-offset: 1px; }
      .angle-entry { position: relative; }
      .angle-entry input { width: 100%; height: 28px; padding: 0 17px 0 4px; appearance: textfield; border: 1px solid #79747e; border-radius: 6px; color: #1d1b20; background: #fff; text-align: right; font-variant-numeric: tabular-nums; }
      .angle-entry input::-webkit-inner-spin-button, .angle-entry input::-webkit-outer-spin-button { appearance: none; margin: 0; }
      .angle-entry input:focus { border-color: #6750a4; outline: 1px solid #6750a4; }
      .angle-entry span { position: absolute; top: 50%; right: 7px; transform: translateY(-50%); pointer-events: none; }
      input[type=range] { width: 100%; height: 4px; margin: 0; appearance: none; border-radius: 4px; background: #c8c3cf; outline: none; }
      input[type=range]::-webkit-slider-thumb { width: 16px; height: 16px; appearance: none; border: 0; border-radius: 50%; background: #6750a4; box-shadow: 0 0 0 5px #6750a41c; cursor: ew-resize; }
      .quickrow { display: grid; grid-template-columns: 84px repeat(3, 1fr); align-items: center; gap: 8px; color: #49454f; }
      .quick { height: 31px; border: 1px solid #79747e; border-radius: 18px; color: #49454f; background: transparent; cursor: pointer; }
      .quick.active { border-color: #6750a4; color: #21005d; background: #e8def8; }
      .secondary { min-height: 38px; border: 0; border-radius: 10px; color: #21005d; background: #e8def8; cursor: pointer; font-weight: 650; }
      .secondary:hover, .quick:hover, .direction:hover { filter: brightness(.97); }
      .secondary.selected { outline: 2px solid #6750a4; outline-offset: 1px; }
      .helper { color: #625d69; font-size: 10px; line-height: 1.45; }
      .grow { flex: 1; min-height: 0; }
      .dock { position: sticky; z-index: 2; bottom: 0; display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 8px; padding-top: 8px; background: #f7f5fa; }
      .dock button { height: 40px; border: 1px solid #79747e; border-radius: 20px; color: #6750a4; background: transparent; cursor: pointer; font-weight: 650; }
      .dock button:hover { background: #f0edf4; }
      .dock button:disabled { opacity: .45; cursor: not-allowed; }
      .dock button:disabled:hover { background: transparent; }
      .dock .apply { border-color: #6750a4; color: #fff; background: #6750a4; box-shadow: 0 2px 4px #0002; }
      .dock .apply:hover { background: #5b4596; }
      .toast { position: fixed; z-index: 3; right: 18px; bottom: 70px; left: 18px; padding: 10px 13px; border-radius: 8px; color: #f5efff; background: #322f35; text-align: center; opacity: 0; transform: translateY(8px); transition: .18s ease; pointer-events: none; }
      .toast.show { opacity: 1; transform: translateY(0); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="identity"><div class="mark" aria-hidden="true"><!-- APP_ICON --></div><div class="brand">Vasometric</div></div>
        <label class="language-control" aria-label="Language">
          <select id="language-select" aria-label="Language">
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
          </select>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5z"/></svg>
        </label>
      </header>
      <main>
        <nav class="modebar" aria-label="Transform mode" data-i18n-aria="aria.transformMode">
          <button class="mode active" data-mode="isometric" data-i18n="mode.axonometric">Axonometric</button>
          <button class="mode" data-mode="perspective" data-i18n="mode.perspective">Perspective</button>
        </nav>
        <section class="stage">
          <div class="stage-head" data-i18n="canvasPreview">Canvas preview</div>
          <canvas id="preview" aria-label="Selected layer transform preview" data-i18n-aria="aria.preview"></canvas>
          <div class="empty-preview" id="empty-preview" data-i18n="emptyPreview">Select a layer to see its live preview</div>
        </section>
        <div class="selectionline"><span id="selection-text" data-i18n="chooseLayers">Choose layers on the canvas</span><span class="selectionbadge" id="selection">0 selected</span></div>
        <section class="mode-panel" id="isometric-panel">
          <div class="directions" id="directions">
            <button class="direction" data-direction="left" data-i18n="direction.left">← Left</button><button class="direction" data-direction="top-left" data-i18n="direction.topLeft">↙ Top left</button><button class="direction active" data-direction="right" data-i18n="direction.right">Right →</button><button class="direction" data-direction="top-right" data-i18n="direction.topRight">Top right ↘</button>
          </div>
          <div class="control-card">
            <div class="control angle-control"><label class="label" for="angle-range" data-i18n="angle">Angle</label><input id="angle-range" type="range" min="-180" max="180" step="1" value="0" data-key="angle"><div class="angle-entry"><input id="angle-input" type="number" min="-180" max="180" step="1" value="0" data-key="angle" aria-label="Angle in degrees" data-i18n-aria="aria.angle"><span aria-hidden="true">°</span></div></div>
            <div class="quickrow"><span data-i18n="snap">Snap</span><button class="quick active" data-angle="0">0°</button><button class="quick" data-angle="30">30°</button><button class="quick" data-angle="45">45°</button></div>
            <label class="control"><span class="label" data-i18n="extrudeDepth">Extrude depth</span><input type="range" min="0" max="200" value="0" data-key="depth"><output data-output="depth">0 px</output></label>
            <div id="isometric-extrusion-options"></div>
          </div>
          <button class="secondary" id="generate-grid" aria-pressed="false" data-i18n="showGrid">Show 3D cube grid</button>
        </section>
        <section class="mode-panel" id="perspective-panel" hidden>
          <nav class="subtabs" aria-label="Perspective tools" data-i18n-aria="aria.perspectiveTools">
            <button class="subtab active" data-panel="skew" data-i18n="panel.skew">Skew</button><button class="subtab" data-panel="3d">3D</button><button class="subtab" data-panel="camera" data-i18n="panel.camera">Camera</button><button class="subtab" data-panel="extrusion" data-i18n="panel.extrude">Extrude</button><button class="subtab" data-panel="shadow" data-i18n="panel.shadow">Shadow</button>
          </nav>
          <div class="control-card" id="perspective-controls"></div>
        </section>
        <div class="grow"></div>
        <footer class="dock"><button id="reset" data-i18n="reset">Reset preview</button><button id="restore" data-i18n="restore" disabled>Restore original</button><button class="apply" id="apply" data-i18n="apply">Apply to selection</button></footer>
      </main>
      <div class="color-popover" id="color-popover" role="dialog" aria-label="Color picker" data-i18n-aria="pickerLabel" hidden>
        <div class="picker-header"><strong id="picker-title">Extrusion color</strong><button class="picker-close" id="picker-close" aria-label="Close color picker" data-i18n-aria="pickerClose">×</button></div>
        <div class="picker-sv" id="picker-sv" role="group" tabindex="0" aria-label="Saturation and brightness" data-i18n-aria="pickerSv"><span class="picker-sv-thumb" id="picker-sv-thumb"></span></div>
        <div class="picker-strips"><div class="picker-bars"><input id="picker-hue" type="range" min="0" max="360" step="1" value="0" aria-label="Hue" data-i18n-aria="pickerHue"><div class="picker-alpha-track"><div id="picker-alpha-gradient"></div><input id="picker-alpha" type="range" min="0" max="255" step="1" value="255" aria-label="Opacity" data-i18n-aria="pickerAlpha"></div></div><span class="color-swatch" aria-hidden="true"><span class="color-swatch-fill" id="picker-swatch-fill"></span></span></div>
        <div class="picker-channels"><label><input id="picker-hex" type="text" spellcheck="false" maxlength="9" value="#625D69FF">HEX8</label><label><input id="picker-red" type="number" min="0" max="255" step="1">R</label><label><input id="picker-green" type="number" min="0" max="255" step="1">G</label><label><input id="picker-blue" type="number" min="0" max="255" step="1">B</label><label><input id="picker-alpha-value" type="number" min="0" max="100" step="1">A %</label></div>
        <label class="picker-rgba-field">RGBA <input id="picker-rgba" type="text" spellcheck="false"></label>
        <div class="picker-material"><span class="picker-material-title" data-i18n="materialColors">Material colors</span><div class="picker-material-colors" id="picker-material-colors"></div></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
    <!-- BUN_UI_BUNDLE -->
  </body>
</html>
